<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Probar bot Gemini</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f1117;
      color: #f4f6fb;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .wrap {
      width: 100%;
      max-width: 760px;
      height: 85vh;
      background: #171b26;
      border: 1px solid #2d3448;
      border-radius: 22px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
    }
    .header {
      padding: 18px 20px;
      border-bottom: 1px solid #2d3448;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .header h1 { font-size: 18px; }
    .status {
      font-size: 12px;
      color: #9ca3af;
      background: #202638;
      padding: 7px 10px;
      border-radius: 999px;
    }
    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg {
      max-width: 82%;
      padding: 12px 14px;
      border-radius: 16px;
      line-height: 1.45;
      white-space: pre-wrap;
      font-size: 14px;
    }
    .user { align-self: flex-end; background: #4f6ef7; color: white; border-bottom-right-radius: 5px; }
    .bot { align-self: flex-start; background: #202638; border: 1px solid #2d3448; color: #f4f6fb; border-bottom-left-radius: 5px; }
    .error { align-self: flex-start; background: #3a1518; border: 1px solid #ef4444; color: #fecaca; border-bottom-left-radius: 5px; }
    .form {
      border-top: 1px solid #2d3448;
      padding: 14px;
      display: flex;
      gap: 10px;
      background: #131722;
    }
    textarea {
      flex: 1;
      resize: none;
      min-height: 46px;
      max-height: 120px;
      border: 1px solid #2d3448;
      border-radius: 14px;
      background: #202638;
      color: #f4f6fb;
      padding: 12px 14px;
      font-family: inherit;
      font-size: 14px;
      outline: none;
    }
    textarea:focus { border-color: #4f6ef7; }
    button {
      border: 0;
      border-radius: 14px;
      background: #4f6ef7;
      color: white;
      padding: 0 18px;
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .hint {
      padding: 0 16px 12px;
      color: #9ca3af;
      font-size: 12px;
      background: #131722;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header class="header">
      <div>
        <h1>Probar bot Gemini</h1>
        <p style="color:#9ca3af;font-size:13px;margin-top:4px;">Escribí un mensaje y probá si responde el bot.</p>
      </div>
      <div class="status" id="status">Listo</div>
    </header>

    <section class="chat" id="chat">
      <div class="msg bot">Hola 👋 Mandame un mensaje para probar si Gemini responde.</div>
    </section>

    <form class="form" id="form">
      <textarea id="message" placeholder="Ej: Hola, quiero consultar horarios de Pucará..." rows="2"></textarea>
      <button id="send" type="submit">Enviar</button>
    </form>

    <div class="hint">Enter para enviar · Shift + Enter para salto de línea</div>
  </main>

  <script>
    const form = document.getElementById("form");
    const input = document.getElementById("message");
    const chat = document.getElementById("chat");
    const sendBtn = document.getElementById("send");
    const statusEl = document.getElementById("status");

    function addMessage(text, type) {
      const div = document.createElement("div");
      div.className = "msg " + type;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    async function sendMessage() {
      const message = input.value.trim();
      if (!message) return;

      addMessage(message, "user");
      input.value = "";
      input.focus();

      sendBtn.disabled = true;
      sendBtn.textContent = "Enviando...";
      statusEl.textContent = "Pensando...";

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({ message })
        });

        const data = await res.json().catch(() => ({}));

        if (!res.ok) {
          addMessage(data.error || "Error llamando a /api/chat", "error");
          statusEl.textContent = "Error";
          return;
        }

        addMessage(data.reply || "(Sin respuesta del bot)", "bot");
        statusEl.textContent = "Listo";
      } catch (err) {
        addMessage("No pude conectar con /api/chat. Revisá si el servidor está prendido.", "error");
        statusEl.textContent = "Sin conexión";
      } finally {
        sendBtn.disabled = false;
        sendBtn.textContent = "Enviar";
      }
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      sendMessage();
    });

    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
  </script>
</body>
</html>
